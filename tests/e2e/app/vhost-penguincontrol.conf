<VirtualHost *:80>
	ServerName localhost
	ServerAdmin root@localhost

	DocumentRoot /opt/penguinControl/public
	<Directory /opt/penguinControl/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/penguincontrol_error.log
	CustomLog ${APACHE_LOG_DIR}/penguincontrol_access.log combined
</VirtualHost>
