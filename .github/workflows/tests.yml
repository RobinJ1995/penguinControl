name: Tests

# Pull requests only. workflow_dispatch just adds a "Run workflow" button in the
# Actions tab -- it never fires on its own.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run already in flight rather than
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PHPUnit and asset build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # composer.json requires PHP ^8.4 and the runner image ships 8.3, so this
      # is not optional.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, gd, curl, xml, bcmath
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The end-to-end image runs this too. Building it here means a broken Vite
      # config fails in under a minute rather than partway through that image.
      - run: npm run build

      - name: PHPUnit
        run: vendor/bin/phpunit

  e2e:
    name: End to end (Apache, MariaDB, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Both images are built under the names tests/e2e/docker-compose.yml
      # declares, so the run below can use them with --no-build. This is the
      # build-separately-then---no-build flow tests/e2e/README.md documents.
      #
      # Layer caching pays for itself here: everything up to and including
      # `composer install` is keyed on the lockfiles rather than the source, so a
      # pull request that only touches application code reuses the apt install of
      # Apache, mpm-itk and mod_php, the npm install, and the Composer install.
      - name: Build the panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/e2e/app/Dockerfile
          tags: penguincontrol-e2e-app:latest
          load: true
          cache-from: type=gha,scope=e2e-app
          cache-to: type=gha,scope=e2e-app

      # Its build context is tests/e2e, matching the compose file.
      - name: Build the test runner image
        uses: docker/build-push-action@v6
        with:
          context: tests/e2e
          file: tests/e2e/runner/Dockerfile
          tags: penguincontrol-e2e-runner:latest
          load: true
          cache-from: type=gha,scope=e2e-runner
          cache-to: type=gha,scope=e2e-runner

      - name: Run the suite
        working-directory: tests/e2e
        run: docker compose up --no-build --abort-on-container-exit --exit-code-from runner

      # behave already dumps the URL, the browser console and laravel.log for a
      # failing scenario. This covers the case where the failure is Apache or
      # MariaDB rather than a scenario.
      - name: Container logs
        if: failure()
        working-directory: tests/e2e
        run: docker compose logs --no-color panel db

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-reports
          path: tests/e2e/reports/*.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        working-directory: tests/e2e
        run: docker compose down -v
